<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta lang="fr">
    <title>Tableau Croisé Dynamique - DSFR</title>

    <!-- DSFR Design System CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.9.7/dist/dsfr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.9.7/dist/utility/icons/icons.min.css">

    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- External libraries -->
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui-touch-punch/0.2.3/jquery.ui.touch-punch.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.fr.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/export_renderers.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  </head>
  <body>

      <!-- Ultra-compact essential controls -->
      <div id="controls-container" role="toolbar" aria-label="Options du tableau">
          <label for="view-mode-select" class="inline-label">Vue:</label>
          <select id="view-mode-select" aria-label="Sélectionner la vue du tableau">
              <option value="pivot">Tableau Croisé</option>
              <option value="fullscreen">Plein écran</option>
          </select>

          <label for="column-size-select" class="inline-label">Taille:</label>
          <select id="column-size-select" aria-label="Ajuster la taille des colonnes">
              <option value="1.0">1.0x</option>
              <option value="0.9">0.9x</option>
              <option value="0.8">0.8x</option>
              <option value="0.7">0.7x</option>
              <option value="0.6">0.6x</option>
              <option value="0.5">0.5x</option>
              <option value="0.4">0.4x</option>
              <option value="0.35">0.35x</option>
              <option value="0.3">0.3x</option>
              <option value="0.25">0.25x</option>
          </select>

          <label class="checkbox-label">
              <input type="checkbox" id="subtotals-checkbox" aria-label="Afficher ou masquer les sous-totaux" />
              <span>Sous-totaux</span>
          </label>
      </div>
  
    <!-- exit full screen -->
    <button id="fullscreen-exit-button" title="Quitter le mode plein écran" aria-label="Quitter le mode plein écran">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
  
    <!-- fullscreen container -->
    <div id="fullscreen-table-container" style="display: none;"></div>

    <div id="table"></div>
    <script src="colorManager.js"></script>
    <script src="columnSizeManager.js"></script>
    <script src="subtotalsManager.js"></script>
    <script src="PivotLabels.js"></script>
    <script src="excelExporter.js"></script>
    <script src="index.js"></script>
  </body>
</html>
